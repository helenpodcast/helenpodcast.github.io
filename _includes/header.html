<header>
  <!-- <h1><a href="{{ "/" | relative_url }}">{{ site.title }}</a></h1> -->

  {% if site.logo %}
    <a href="{{ "/" | relative_url }}">
      <img src="{{ site.logo | relative_url }}" alt="Logo" />
    </a>
  {% endif %}

  <p>{{ site.description }}</p>

  <div class="header-links">
      <h4>Quick Links</h4>
      <ul>
          <li><a href="{{ "/" | relative_url }}">Home</a></li>
          <li><a href="{{ "/episodes" | relative_url }}">Episodes</a></li>
          <li><a href="{{ "/phrases" | relative_url }}">Phrases</a></li>
          <li><a href="{{ "/about" | relative_url }}">About the Podcast</a></li>
          <hr />
          <li><a href="{{ site.social.youtube.url }}" aria-label="Youtube"><i class="fab fa-youtube"></i> Youtube</a></li>
          <li><a href="{{ site.social.instagram.url }}" aria-label="Instagram"><i class="fab fa-instagram"></i> Instagram</a></li>
          <li><a href="{{ site.social.spotify.url }}" aria-label="Spotify"><i class="fab fa-spotify"></i> Spotify</a></li>
          <li><a href="{{ site.social.reddit.url }}" aria-label="Reddit"><i class="fab fa-reddit"></i> Reddit</a></li>
      </ul>
  </div>
</header>
