<div class="episode-card">
    <h2><a href="{{ episode.url }}">{{ episode.title }}</a></h2>
    <div class="episode-meta">
        <time datetime="{{ episode.date | date_to_xmlschema }}">{{ episode.date | date: "%B %d, %Y" }}</time>
    </div>

    {% if episode.youtube_id %}
    <iframe
        width="560"
        height="315"
        src="https://www.youtube.com/embed/{{ episode.youtube_id }}"
        title="YouTube video player"
        frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen
    ></iframe>
    {% endif %}

    <p>
      {% if episode.short_description %}
          {{ episode.short_description }}
      {% else %}
          {{ episode.excerpt | strip_html | truncatewords: 10 }}
      {% endif %}
    </p>
</div>
<hr />
