<footer class="site-footer">
    <div class="footer-container">
        <div class="footer-about">
            <h3>{{ site.footer.title }}</h3>
            <p>{{ site.footer.description }}</p>
        </div>

        <div class="footer-social">
            <h4>Connect</h4>
            <div class="social-icons">
                <a href="{{ site.social.youtube.url }}" aria-label="Youtube">
                    <i class="fab fa-youtube"></i>
                </a>
                <a href="{{ site.social.instagram.url }}" aria-label="Instagram">
                    <i class="fab fa-instagram"></i>
                </a>
                <a href="{{ site.social.spotify.url }}" aria-label="Spotify">
                    <i class="fab fa-spotify"></i>
                </a>
                <a href="{{ site.social.reddit.url }}" aria-label="Reddit">
                    <i class="fab fa-reddit"></i>
                </a>
                <a href="mailto:{{ site.social.email.email }}" aria-label="Email">
                    <i class="fas fa-envelope"></i>
                </a>
            </div>
        </div>
    </div>

    <div class="footer-bottom">
        <p>&copy; {{ 'now' | date: "%Y" }} {{ site.title }}. All rights reserved.</p>
    </div>
</footer>
